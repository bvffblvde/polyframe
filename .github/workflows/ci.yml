name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm build
      - run: pnpm build-storybook --quiet
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  exported-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run src/core/exporters
        env:
          EXPORT_FIXTURE_DIR: exporter-check/generated
      - run: pnpm --dir exporter-check install --ignore-workspace
      - run: pnpm --dir exporter-check check
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test -c exporter-check/fidelity/playwright.config.ts
        env:
          CI: "true"
      - run: node exporter-check/fidelity/report.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fidelity
          path: exporter-check/fidelity/.out
          retention-days: 14

  bench:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - uses: actions/cache/restore@v4
        with:
          path: bench/.baseline
          key: bench-baseline-${{ github.run_id }}
          restore-keys: bench-baseline-
      - run: pnpm exec playwright test -c bench/playwright.config.ts
        env:
          CI: "true"
      - run: node bench/report.mjs --baseline bench/.baseline/results.json
      - if: success()
        run: mkdir -p bench/.baseline && cp bench/.out/results.json bench/.baseline/results.json
      - if: success()
        uses: actions/cache/save@v4
        with:
          path: bench/.baseline
          key: bench-baseline-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench
          path: bench/.out
          retention-days: 30
